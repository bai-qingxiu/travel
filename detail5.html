<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云南民族村 · 深度攻略</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, 'PingFang SC', sans-serif;
            background: #fcf7ef;
            color: #2c2b28;
            line-height: 1.6;
        }
        .detail-wrapper {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 48px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.1);
        }
        .back-home {
            display: inline-block;
            margin-bottom: 1.5rem;
            background: #eef2e6;
            padding: 6px 18px;
            border-radius: 40px;
            text-decoration: none;
            color: #2a6e3a;
            font-weight: 500;
        }
        .back-home i { margin-right: 6px; }
        h1 {
            font-size: 2.3rem;
            color: #1f3d2c;
            margin: 0.5rem 0;
            border-left: 5px solid #e6b422;
            padding-left: 20px;
        }
        .detail-img {
            width: 100%;
            height: 320px;
            background: url('images/img5.jpg') center/cover;
            border-radius: 32px;
            margin: 1.2rem 0;
            box-shadow: 0 5px 12px rgba(0,0,0,0.1);
        }
        .info-section {
            background: #eef4ea;
            padding: 1.5rem;
            border-radius: 28px;
            margin: 1.8rem 0;
        }
        h3 {
            color: #2a6e3a;
            margin: 1rem 0 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.3rem;
        }
        p { margin-bottom: 0.8rem; }
        .footer-note {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.85rem;
            border-top: 1px solid #ddd;
            padding-top: 1.2rem;
            color: #5a6e53;
        }
        @media (max-width: 680px){
            .detail-wrapper { margin: 1rem; padding: 1.2rem; }
            h1 { font-size: 1.7rem; }
            .detail-img { height: 200px; }
        }
    </style>
</head>
<body>
    <div class="detail-wrapper">
        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
        <h1><i class="fas fa-map-marked-alt"></i> 云南民族村 · 深度旅程</h1>
        <div class="detail-img"></div>
        <div class="info-section">
            <h3><i class="fas fa-calendar-check"></i> 🌟 最佳旅游时间</h3>
            <p>全年适合游玩，4月傣族泼水节、7月火把节活动氛围最浓厚。</p>
            <h3><i class="fas fa-road"></i> 🚗 路线推荐 & 行程安排</h3>
            <p>乘公交44路、73路至民族村站；入园后按地图依次游览各个民族村寨，观看歌舞、民俗表演。</p>
            <h3><i class="fas fa-heart"></i> 💭 游玩感受</h3>
            <p>一日之内体验云南多个少数民族风情，建筑、服饰、歌舞各具特色，文化氛围浓郁。</p>
            <h3><i class="fas fa-lightbulb"></i> 📌 出行锦囊</h3>
            <p>建议预留半天以上时间游览，可主动参与竹竿舞等互动项目。</p>
        </div>
        <div class="footer-note">
            <i class="fas fa-camera"></i> 实景影像记录 | 每一次出发，都是与春城的灵魂共振
        </div>
    </div>
</body>
</html>
