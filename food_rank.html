<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昆明美食推荐排行</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background-color: #fef6ea;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .rank-item {
            background: #fff;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 6px 15px rgba(0,0,0,0.07);
        }
        .rank-num {
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
        }
        .rank-1 { background: #ff4d4f; }
        .rank-2 { background: #fa8c16; }
        .rank-3 { background: #f7ba1e; }
        .rank-other { background: #8c8c8c; }
        .back-btn {
            margin: 2rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 返回首页按钮 -->
        <div class="back-btn">
            <a href="index.html" class="btn btn-outline-success">
                <i class="fas fa-arrow-left"></i> 返回首页
            </a>
        </div>

        <h2 class="text-center mb-5 fw-bold text-success">
            <i class="fas fa-trophy"></i> 昆明人气美食排行榜
        </h2>

        <!-- 排行列表 -->
        <div class="rank-list">
            <div class="rank-item d-flex align-items-center gap-4">
                <div class="rank-num rank-1">1</div>
                <div class="flex-grow-1">
                    <h5 class="fw-bold">过桥米线</h5>
                    <p class="text-muted mb-0">综合人气第一名，外地游客首选，经典滇味代表。</p>
                </div>
                <span class="badge bg-success">推荐指数 ★★★★★</span>
            </div>

            <div class="rank-item d-flex align-items-center gap-4">
                <div class="rank-num rank-2">2</div>
                <div class="flex-grow-1">
                    <h5 class="fw-bold">鲜花饼</h5>
                    <p class="text-muted mb-0">热门伴手礼，花香浓郁，老少皆宜。</p>
                </div>
                <span class="badge bg-success">推荐指数 ★★★★★</span>
            </div>

            <div class="rank-item d-flex align-items-center gap-4">
                <div class="rank-num rank-3">3</div>
                <div class="flex-grow-1">
                    <h5 class="fw-bold">汽锅鸡</h5>
                    <p class="text-muted mb-0">非遗美食，鲜香滋补，本地人与游客都爱品尝。</p>
                </div>
                <span class="badge bg-success">推荐指数 ★★★★☆</span>
            </div>

            <div class="rank-item d-flex align-items-center gap-4">
                <div class="rank-num rank-other">4</div>
                <div class="flex-grow-1">
                    <h5 class="fw-bold">豆花米线</h5>
                    <p class="text-muted mb-0">街头人气小吃，香辣爽口，日常就餐首选。</p>
                </div>
                <span class="badge bg-success">推荐指数 ★★★★☆</span>
            </div>

            <div class="rank-item d-flex align-items-center gap-4">
                <div class="rank-num rank-other">5</div>
                <div class="flex-grow-1">
                    <h5 class="fw-bold">野生菌火锅</h5>
                    <p class="text-muted mb-0">时令特色美食，鲜味独特，季节性必吃。</p>
                </div>
                <span class="badge bg-success">推荐指数 ★★★★</span>
            </div>

            <div class="rank-item d-flex align-items-center gap-4">
                <div class="rank-num rank-other">6</div>
                <div class="flex-grow-1">
                    <h5 class="fw-bold">烧饵块</h5>
                    <p class="text-muted mb-0">昆明传统早餐，充满本地烟火气息。</p>
                </div>
                <span class="badge bg-success">推荐指数 ★★★★</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
